<!-- Generado por scripts/construir-turnos.py. No editar a mano: se pierde al regenerar. -->
<title>Turnos · Tierradentro Café Express</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link id="fuentes" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@1,900&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style id="st">
/* Layout: banda carbón con logo y pestañas (Calendario, Mi turno, Administración); calendario personas x días; Mi turno pensado para celular.
   Marca: design system "Tierradentro Café" (tema Crema; tema Carbón en oscuro). Regla de color: lienzo neutro, bloques de apoyo tierra, naranja y sol solo como detalle. */
:root{
  --crema:#feffdb; --piedra:#cec7bf; --carbon:#111113; --hueso:#e0ddd6; --salvia:#67746e; --arena-gris:#a8a49b; --blanco:#ffffff;
  --arena:#d2b48c; --trigo:#d7c797; --madera:#af753e; --grafito:#5a5a5a; --cafe:#69432d; --brote:#87ba77;
  --terracota:#a35a37; --pino:#396047; --vino:#740001; --naranja:#fe502c; --sol:#ffce5c;
  --bg:var(--crema); --surface:var(--blanco); --ink:var(--carbon); --muted:var(--grafito); --line:var(--piedra);
  --band:var(--carbon); --band-ink:var(--crema); --band-edge:var(--carbon);
  --accent:var(--cafe); --accent-ink:var(--crema); --accent-soft:var(--hueso);
  --head:var(--arena); --zebra:color-mix(in srgb,var(--hueso) 45%,var(--blanco));
  --cta:var(--naranja); --cta-ink:var(--carbon);
  --strong:var(--carbon); --strong-ink:var(--crema);
  --mark:var(--sol); --mark-ink:var(--carbon);
  --shift:var(--trigo); --shift-ink:var(--carbon); --shift-edge:var(--madera);
  --rest:var(--salvia); --rest-ink:var(--crema);
  --fest:var(--hueso); --fest-ink:var(--vino);
  --bad:var(--vino); --bad-soft:color-mix(in srgb,var(--vino) 10%,var(--blanco));
  --warn:var(--terracota); --warn-soft:color-mix(in srgb,var(--sol) 32%,var(--blanco));
  --good:var(--pino); --good-soft:color-mix(in srgb,var(--brote) 28%,var(--blanco));
  --drop:color-mix(in srgb,var(--trigo) 60%,var(--blanco));
  --cov0:color-mix(in srgb,var(--hueso) 55%,var(--blanco)); --cov1:var(--arena); --cov2:var(--madera); --cov3:var(--cafe); --cov4:var(--carbon);
  --font-display:"Archivo Black","Arial Black",Impact,sans-serif;
  --font-wide:"Franklin Gothic Heavy","Archivo","Arial Black",sans-serif;
  --font-body:"Bahnschrift SemiBold Condensed","Bahnschrift","Barlow Semi Condensed","Arial Narrow",sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:var(--carbon); --surface:#1d1d20; --ink:var(--crema); --muted:var(--arena-gris); --line:#3a3a3d;
  --band:var(--carbon); --band-ink:var(--crema); --band-edge:#3a3a3d;
  --accent:var(--arena); --accent-ink:var(--carbon); --accent-soft:color-mix(in srgb,var(--arena) 16%,#1d1d20);
  --head:color-mix(in srgb,var(--arena) 24%,#1d1d20); --zebra:color-mix(in srgb,var(--crema) 4%,#1d1d20);
  --cta:var(--naranja); --cta-ink:var(--carbon);
  --strong:var(--crema); --strong-ink:var(--carbon);
  --mark:var(--sol); --mark-ink:var(--carbon);
  --shift:var(--trigo); --shift-ink:var(--carbon); --shift-edge:var(--madera);
  --rest:var(--salvia); --rest-ink:var(--crema);
  --fest:color-mix(in srgb,var(--madera) 18%,#1d1d20); --fest-ink:var(--sol);
  --bad:var(--naranja); --bad-soft:color-mix(in srgb,var(--vino) 45%,#1d1d20);
  --warn:var(--sol); --warn-soft:color-mix(in srgb,var(--sol) 14%,#1d1d20);
  --good:var(--brote); --good-soft:color-mix(in srgb,var(--pino) 40%,#1d1d20);
  --drop:color-mix(in srgb,var(--arena) 34%,#1d1d20);
  --cov0:var(--carbon); --cov1:var(--cafe); --cov2:var(--madera); --cov3:var(--arena); --cov4:var(--crema);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:var(--carbon); --surface:#1d1d20; --ink:var(--crema); --muted:var(--arena-gris); --line:#3a3a3d;
  --band:var(--carbon); --band-ink:var(--crema); --band-edge:#3a3a3d;
  --accent:var(--arena); --accent-ink:var(--carbon); --accent-soft:color-mix(in srgb,var(--arena) 16%,#1d1d20);
  --head:color-mix(in srgb,var(--arena) 24%,#1d1d20); --zebra:color-mix(in srgb,var(--crema) 4%,#1d1d20);
  --cta:var(--naranja); --cta-ink:var(--carbon);
  --strong:var(--crema); --strong-ink:var(--carbon);
  --mark:var(--sol); --mark-ink:var(--carbon);
  --shift:var(--trigo); --shift-ink:var(--carbon); --shift-edge:var(--madera);
  --rest:var(--salvia); --rest-ink:var(--crema);
  --fest:color-mix(in srgb,var(--madera) 18%,#1d1d20); --fest-ink:var(--sol);
  --bad:var(--naranja); --bad-soft:color-mix(in srgb,var(--vino) 45%,#1d1d20);
  --warn:var(--sol); --warn-soft:color-mix(in srgb,var(--sol) 14%,#1d1d20);
  --good:var(--brote); --good-soft:color-mix(in srgb,var(--pino) 40%,#1d1d20);
  --drop:color-mix(in srgb,var(--arena) 34%,#1d1d20);
  --cov0:var(--carbon); --cov1:var(--cafe); --cov2:var(--madera); --cov3:var(--arena); --cov4:var(--crema);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--font-body);letter-spacing:.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.band{background:var(--band);color:var(--band-ink);border-bottom:1px solid var(--band-edge)}
.band :focus-visible{outline-color:var(--mark)}
.band .gut{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px 8px;max-width:1600px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{flex:none;width:56px;height:56px;display:block}
.eyebrow{margin:0;font:italic 900 12px/1.3 var(--font-wide);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
h1{margin:0;font:400 22px/1.15 var(--font-display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.state{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.14)}
.state i{width:8px;height:8px;border-radius:50%;background:var(--brote)}
.state.dirty i{background:var(--sol)}
.state.ro i{background:var(--naranja)}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1600px;margin:0 auto;padding-block:0}
.band .tabs{justify-content:flex-start;flex-wrap:nowrap;padding-block:0}
.tab{background:transparent;border:0;color:var(--band-ink);opacity:.78;padding:10px 14px 9px;font-weight:800;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tab:hover{opacity:1}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--mark)}
.badge{background:var(--mark);color:var(--mark-ink);border-radius:999px;padding:0 8px;font-size:12px;line-height:20px}

main{max-width:1600px;margin:0 auto;padding-block:18px 32px;display:grid;gap:16px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.grow{flex:1 1 auto}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r);padding:9px 16px;font-weight:700;cursor:pointer;border:1.5px solid transparent;min-height:42px}
.btn svg{flex:none}
.btn.outline{background:var(--surface);border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--cta);color:var(--cta-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.plain{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.big{min-height:64px;font-size:19px;justify-content:center;width:100%}
.btn.in{background:var(--strong);color:var(--strong-ink)}
.btn.out{background:var(--shift);color:var(--shift-ink);border-color:var(--shift-edge)}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-weight:700;text-decoration:underline;font-size:14px;justify-self:start}
.weeknav{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:42px}
.weeknav>button{background:transparent;border:0;padding:0 12px;cursor:pointer;color:var(--accent);display:grid;place-items:center}
.datebtn{position:relative;display:grid;place-items:center;padding:0 16px;font-weight:600;font-variant-numeric:tabular-nums;border-inline:1.5px solid var(--line);cursor:pointer;min-width:118px}
.datebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);min-height:42px}
.seg button{border:0;background:transparent;padding:0 14px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.sortl{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.sortl select{border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);padding:8px 10px;min-height:42px}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 14px 40px rgba(17,17,19,.22);padding:6px;min-width:280px;display:grid}
.menu button{text-align:left;background:transparent;border:0;border-radius:var(--r);padding:10px 12px;cursor:pointer;display:grid;gap:1px}
.menu button:hover,.menu button:focus-visible{background:var(--accent-soft)}
.menu button b{font-weight:700}
.menu button span{font-size:13px;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.sum{grid-template-columns:minmax(260px,.8fr) minmax(0,1.6fr);align-items:start}}
.sum h2{margin:2px 0 6px;font:400 18px/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.sum .eyebrow{color:var(--muted)}
.kpis{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;color:var(--muted);font-size:14px}
.kpis b{color:var(--ink);font-variant-numeric:tabular-nums}
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.al{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:var(--r);font-size:14px}
.al::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:currentColor}
.al.bad{background:var(--bad-soft);color:var(--bad)}
.al.warn{background:var(--warn-soft);color:var(--warn)}
.al.good{background:var(--good-soft);color:var(--good)}
.al span{color:var(--ink)}
.al b{color:inherit}

.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:minmax(200px,1.25fr) repeat(7,minmax(134px,1fr));min-width:1160px}
.grid>div{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.grid>div:nth-child(8n){border-right:0}
.corner,.hd{background:var(--head)}
.corner{padding:12px 14px;font-weight:800;position:sticky;left:0;z-index:3;display:grid;align-content:center}
.corner small{font-weight:600;color:var(--ink);opacity:.75;font-size:12px}
.hd{text-align:center;padding:10px 6px;display:grid;align-content:center;gap:1px}
.hd b{font:400 13.5px/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.hd span{font-weight:700;font-variant-numeric:tabular-nums}
.hd em{font-style:normal;font-size:12px;font-weight:700;color:var(--fest-ink);line-height:1.2;margin-top:2px}
.hd.today b{color:var(--ink)}
.hd.today span{display:inline-block;justify-self:center;background:var(--strong);color:var(--strong-ink);border-radius:999px;padding:0 9px}
.who{position:sticky;left:0;z-index:2;background:var(--surface);padding:12px 14px;display:grid;align-content:start;gap:2px}
.who .name{all:unset;cursor:pointer;font-weight:800;font-size:15px;line-height:1.25}
.who .name:hover{text-decoration:underline}
.who .name:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:3px}
.who .name.ro{cursor:default;text-decoration:none}
.meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{font-weight:700;color:var(--muted)}
.meta b.bad{color:var(--bad)}
.meta b.slot{display:inline-block;padding:0 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);text-transform:capitalize}
.meta b.slot.pm{background:var(--shift);color:var(--shift-ink)}
.meta b.slot.bad{background:var(--bad-soft);color:var(--bad)}
.cell{padding:8px 6px 26px;display:flex;flex-direction:column;gap:6px;position:relative;min-height:112px;transition:background .12s}
.cell.fest,.ft.fest{background:var(--fest)}
.cell.over{background:var(--drop);outline:2px dashed var(--accent);outline-offset:-4px}
.card{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:6px 9px 7px;background:var(--shift);color:var(--shift-ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 2px 0 var(--shift-edge);line-height:1.2}
.ro-cal .card{cursor:default;touch-action:auto}
.card .tm{display:block;font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card small{display:block;font-size:12px;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.card.rest{background:var(--rest);color:var(--rest-ink);box-shadow:none;display:flex;align-items:center;gap:8px;padding:9px 10px}
.card.rest .tm{font-size:14px}
.card.rest small{margin-top:0;opacity:.9}
.card.lifted{opacity:.35}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:rotate(2deg);box-shadow:0 12px 30px rgba(17,17,19,.35)!important}
.ghost .copytag{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.add{position:absolute;left:6px;right:6px;bottom:4px;height:20px;border:1px dashed transparent;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-weight:800;line-height:1;opacity:0;transition:opacity .12s}
.cell:hover .add,.add:focus-visible{opacity:1;border-color:var(--line)}
@media (hover:none){.add{opacity:.7;border-color:var(--line)}}
.ftl{position:sticky;left:0;z-index:2;background:var(--surface);padding:10px 14px;font-weight:800;display:grid;align-content:center}
.ftl small{font-weight:600;color:var(--muted);font-size:12px}
.ft{padding:10px 8px;display:grid;gap:4px;border-bottom:0!important}
.grid>.ftl{border-bottom:0}
.cov{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:1px}
.cov i{flex:1;background:var(--cov0)}
.cov i.c1{background:var(--cov1)} .cov i.c2{background:var(--cov2)} .cov i.c3{background:var(--cov3)} .cov i.c4{background:var(--cov4)}
.ticks{position:relative;height:14px;font-size:10.5px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span:first-child{transform:none}
.ft p{margin:0;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ft p b{color:var(--ink)}
.help{margin:0;color:var(--muted);font-size:14px;max-width:80ch}
kbd{font:700 12px var(--font-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px;min-width:0}
.panel h2{margin:0;font:400 18px/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.panel h3{margin:0;font:italic 900 16px/1.25 var(--font-wide)}
.panel p{margin:0}
.panel .lead{color:var(--muted);font-size:14px}
.hoy{border-width:2px;border-color:var(--accent)}
.hoy-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.prog{font-size:16px}
.estado{font-weight:700;padding:8px 12px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent)}
.fld{display:grid;gap:4px;font-weight:700;font-size:14px;min-width:0}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line);border-radius:var(--r);padding:9px 10px;background:var(--bg);min-height:44px;width:100%;font-weight:400}
.fld textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pick button{border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r);padding:14px;text-align:left;font-weight:800;cursor:pointer;min-height:56px}
.pick button:hover{border-color:var(--accent)}
.tblw{overflow-x:auto;min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink);background:var(--head);font-weight:700;white-space:nowrap}
.tbl tbody tr:nth-child(even) td:not(.late):not(.miss){background:var(--zebra)}
.tbl td.late{background:var(--warn-soft)}
.tbl td.miss{background:var(--bad-soft)}
.tbl .sm{display:block;font-size:12px;color:var(--muted)}
.tbl .mk{display:block;font-weight:700;white-space:nowrap}
.tbl tfoot td{font-weight:800}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:800;white-space:nowrap}
.chip.pend{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.no{background:var(--bad-soft);color:var(--bad)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.feed li{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px;min-width:0}
.feed .who2{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.feed .who2 b{color:var(--ink)}
.feed p{overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.note{padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);font-size:14px}
.empty{color:var(--muted);font-size:14px}
details>summary{cursor:pointer;font-weight:700;color:var(--accent)}

.ov{position:fixed;inset:0;z-index:50;background:rgba(17,17,19,.6);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);color:var(--ink);border-radius:var(--r);width:min(520px,100%);max-height:calc(100% - 8px);overflow:auto;padding:20px;display:grid;gap:14px;box-shadow:0 24px 60px rgba(17,17,19,.35)}
.dlg h3{margin:0;font:italic 900 19px/1.2 var(--font-wide)}
.dlg p{margin:0}
.dlg label{display:grid;gap:4px;font-weight:700;font-size:14px;min-width:0}
.dlg input,.dlg select,.dlg textarea{border:1.5px solid var(--line);border-radius:var(--r);padding:9px 10px;background:var(--bg);min-height:42px;width:100%}
.dlg textarea{min-height:240px;font:13px/1.45 ui-monospace,Consolas,monospace;resize:vertical}
.dlg.descanso .tonly{display:none}
.dur{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.dur.bad{color:var(--bad);font-weight:700}
.presets>span{font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1.5px solid var(--shift-edge);background:var(--shift);color:var(--shift-ink);border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.dlg-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:var(--r);display:flex;gap:14px;align-items:center;max-width:min(560px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:600;font-size:14px}
.toast button{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:var(--r);padding:4px 10px;font-weight:800;cursor:pointer;flex:none}
@media (max-width:640px){h1{font-size:20px}.sortl span{display:none}.btn{padding:9px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.foot{max-width:1600px;margin:0 auto;padding-block:8px 28px;display:grid;gap:4px;color:var(--muted);font-size:13.5px}
.foot p{margin:0;max-width:90ch}
.foot .lema{font:italic 900 14px/1.3 var(--font-wide);color:var(--ink)}

/* utilidades */
function clone(o){return JSON.parse(JSON.stringify(o))}
function snap(){return JSON.stringify({e:S.empleados,d:S.dias,m:S.maxSemana})}
function isDirty(){return snap()!==saved}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function add(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function mondayOf(s){var d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function weekDays(w){w=w||week;var a=[];for(var i=0;i<7;i++)a.push(add(w,i));return a}
function mins(t){var p=t.split(':').map(Number);return p[0]*60+p[1]}
function fmt(t){var p=t.split(':').map(Number),h=p[0],ap=h<12?'am':'pm';h=h%12||12;return h+':'+String(p[1]).padStart(2,'0')+' '+ap}
function hhmm(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function durM(it){if(!it||it.tipo!=='turno')return 0;var d=mins(it.fin)-mins(it.ini);if(d<=0)d+=1440;return d}
function h1(m){return (Math.round(m/6)/10).toFixed(1).replace('.',',')}
function hs(m){var h=Math.round(m/6)/10;return (h%1===0?String(h):h.toFixed(1).replace('.',','))}
function items(f,e){return (S.dias[f]&&S.dias[f][e])||[]}
function setItems(f,e,arr){if(!S.dias[f])S.dias[f]={};if(arr.length)S.dias[f][e]=arr;else delete S.dias[f][e];if(!Object.keys(S.dias[f]).length)delete S.dias[f]}
function newId(){S.seq=(S.seq||0)+1;return 'i'+S.seq}
function emp(id){for(var i=0;i<S.empleados.length;i++)if(S.empleados[i].id===id)return S.empleados[i];return null}
function corto(e){return e?(e.corto||e.nombre.split(' ')[0]):'Persona'}
function cortoId(id){return corto(emp(id))}
function isDom(f){return parse(f).getDay()===0||!!S.festivos[f]}
function weekMin(e){return weekDays().reduce(function(a,f){return a+items(f,e).reduce(function(b,it){return b+durM(it)},0)},0)}
function worked(f,e){return items(f,e).some(function(it){return it.tipo==='turno'})}
function domMes(e,y,m){var pre=y+'-'+String(m+1).padStart(2,'0')+'-',n=0;Object.keys(S.dias).forEach(function(f){if(f.indexOf(pre)===0&&isDom(f)&&worked(f,e))n++});return n}
function wkSlot(e,sat){var c={};[sat,add(sat,1)].forEach(function(f){items(f,e).forEach(function(it){if(it.tipo==='turno')c[mins(it.ini)<720?'mañana':'tarde']=1})});var k=Object.keys(c);return k.length===1?k[0]:(k.length?'mixto':null)}
function dayName(f){return DIAS[(parse(f).getDay()+6)%7]}
function fechaCorta(f){var d=parse(f);return DCORTO[(d.getDay()+6)%7]+' '+d.getDate()+' '+MES[d.getMonth()]}
function fechaLarga(f){var d=parse(f);return dayName(f)+' '+d.getDate()+' de '+MESL[d.getMonth()]}
function weekLabel(){var a=parse(week),b=parse(add(week,6));if(a.getMonth()===b.getMonth())return a.getDate()+' al '+b.getDate()+' de '+MESL[b.getMonth()]+' de '+b.getFullYear();return a.getDate()+' de '+MESL[a.getMonth()]+' al '+b.getDate()+' de '+MESL[b.getMonth()]+' de '+b.getFullYear()}
function progText(arr){if(!arr.length)return 'Sin turno programado';if(arr[0].tipo==='descanso')return 'Descanso'+(arr[0].nota?' ('+arr[0].nota+')':'');return arr.filter(function(i){return i.tipo==='turno'}).map(function(i){return fmt(i.ini)+' - '+fmt(i.fin)}).join(' y ')}
function place(f,e,it){var arr=items(f,e).slice();if(it.tipo==='descanso')arr=[it];else{arr=arr.filter(function(x){return x.tipo!=='descanso'});arr.push(it);arr.sort(function(a,b){return mins(a.ini)-mins(b.ini)})}setItems(f,e,arr)}
function removeItem(f,e,id){setItems(f,e,items(f,e).filter(function(x){return x.id!==id}))}
function findItem(f,e,id){var a=items(f,e);for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function commit(fn,msg){hist.push(clone({empleados:S.empleados,dias:S.dias,seq:S.seq}));if(hist.length>60)hist.shift();fn();render();if(msg)toast(msg,true)}

function marcasDe(e){return R.marcas.filter(function(m){return m.emp===e}).sort(function(a,b){return a.ts<b.ts?-1:a.ts>b.ts?1:0})}
function abierta(e){var ms=marcasDe(e),l=ms[ms.length-1];return l&&l.tipo==='entrada'&&(Date.now()-Date.parse(l.ts))<20*36e5?l:null}
function jornadas(e){var out=[],open=null;marcasDe(e).forEach(function(m){if(m.tipo==='entrada'){if(open)out.push({fecha:open.fecha,ent:open,sal:null});open=m}else{if(open){out.push({fecha:open.fecha,ent:open,sal:m});open=null}else out.push({fecha:m.fecha,ent:null,sal:m})}});if(open)out.push({fecha:open.fecha,ent:open,sal:null});return out}
function jornadasDia(e,f){return jornadas(e).filter(function(j){return j.fecha===f})}
function realMin(js){return js.reduce(function(a,j){return a+(j.ent&&j.sal?Math.max(0,Math.round((Date.parse(j.sal.ts)-Date.parse(j.ent.ts))/6e4)):0)},0)}
function jText(j){return (j.ent?fmt(j.ent.hora):'¿?')+' - '+(j.sal?fmt(j.sal.hora):'sin salida')}
function tarde(e,f){var p=items(f,e).filter(function(i){return i.tipo==='turno'}),js=jornadasDia(e,f);if(!p.length||!js.length||!js[0].ent)return 0;var d=mins(js[0].ent.hora)-mins(p[0].ini);return d>10?d:0}
function solEstado(s){var r=R.respuestas[s.id];return r?r.estado:'pendiente'}
function solTexto(s){if(s.tipo==='horario')return 'Cambiar su horario a '+fmt(s.ini)+' - '+fmt(s.fin);if(s.tipo==='cambio')return 'Cambiar el turno con '+cortoId(s.con);if(s.tipo==='descanso')return 'Pedir el día de descanso';return 'Otro cambio'}
function chipEstado(st){return st==='aprobada'?'<span class="chip ok">Aprobada</span>':st==='rechazada'?'<span class="chip no">Rechazada</span>':'<span class="chip pend">Pendiente</span>'}
function pendientes(){return R.solicitudes.filter(function(s){return solEstado(s)==='pendiente'})}
function byTsDesc(a,b){return a.ts<b.ts?1:a.ts>b.ts?-1:0}

function card(it,f,e,i){
  var lbl=DIAS[i]+' '+parse(f).getDate()+', '+e.nombre+': ',ed=canCal();
  if(it.tipo==='descanso')return '<button class="card rest" data-id="'+it.id+'" data-f="'+f+'" data-emp="'+e.id+'" aria-label="'+esc(lbl+'descanso'+(it.nota?', '+it.nota:''))+(ed?'. Editar':'')+'">'+ICON.bed+'<span><span class="tm">Descanso</span>'+(it.nota?'<small>'+esc(it.nota)+'</small>':'')+'</span></button>';
  return '<button class="card" data-id="'+it.id+'" data-f="'+f+'" data-emp="'+e.id+'" aria-label="'+esc(lbl+fmt(it.ini)+' a '+fmt(it.fin))+(ed?'. Editar':'')+'"><span class="tm">'+fmt(it.ini)+' - '+fmt(it.fin)+'</span><small>'+esc(it.nota||e.rol||'General')+' · '+hs(durM(it))+' h</small></button>';
}
function coverage(f){
  var slots=[],people=0,tot=0;
  for(var s=360;s<1620;s+=30)slots.push(0);
  S.empleados.forEach(function(e){
    var on=false;
    items(f,e.id).forEach(function(it){
      if(it.tipo!=='turno')return;on=true;tot+=durM(it);
      var a=mins(it.ini),b=a+durM(it);
      for(var k=0;k<slots.length;k++){var t=360+k*30;if(t>=a&&t<b)slots[k]++}
    });
    if(on)people++;
  });
  var cells=slots.map(function(c,k){var t=360+k*30,hh=Math.floor(t/60)%24,m=t%60;return '<i class="c'+Math.min(c,4)+'" title="'+fmt(String(hh).padStart(2,'0')+':'+String(m).padStart(2,'0'))+': '+c+(c===1?' persona':' personas')+'"></i>'}).join('');
  return '<div class="ft'+(S.festivos[f]?' fest':'')+'"><div class="cov" role="img" aria-label="Cobertura del día">'+cells+'</div><div class="ticks"><span style="left:0">6a</span><span style="left:28.6%">12p</span><span style="left:57.1%">6p</span><span style="left:85.7%">12a</span></div><p><b>'+people+'</b> personas · <b>'+hs(tot)+'</b> h</p></div>';
}
function summary(days){
  var tot=0,turnos=0,al=[];
  S.empleados.forEach(function(e){days.forEach(function(f){items(f,e.id).forEach(function(it){if(it.tipo==='turno'){tot+=durM(it);turnos++}})})});
  var fests=days.filter(function(f){return S.festivos[f]});
  S.empleados.forEach(function(e){
    var wd=days.filter(function(f){return worked(f,e.id)}).length;
    if(wd===7)al.push(['bad','<b>'+esc(corto(e))+'</b> <span>trabaja los 7 días: no tiene descanso esta semana.</span>']);
    var sat=add(week,5),sl=wkSlot(e.id,sat),psl=wkSlot(e.id,add(sat,-7));
    if(sl&&sl!=='mixto'&&sl===psl)al.push(['warn','<b>'+esc(corto(e))+'</b> <span>repite la '+sl+' dos fines de semana seguidos; con la rotación este fin de semana le toca la '+(sl==='mañana'?'tarde':'mañana')+'.</span>']);
  });
  var empty=S.empleados.filter(function(e){return days.some(function(f){return !items(f,e.id).length})});
  if(empty.length)al.push(['warn','<b>Días sin programar</b> <span>para '+empty.map(function(e){return esc(corto(e))}).join(', ')+'. Agrega un turno o un descanso.</span>']);
  if(OWNER&&pendientes().length)al.push(['warn','<b>Solicitudes de cambio</b> <span>hay '+pendientes().length+' pendiente'+(pendientes().length>1?'s':'')+' en Administración.</span>']);
  if(!al.length)al.push(['good','<b>Sin alertas</b> <span>todos tienen su día de descanso y la rotación del fin de semana está al día.</span>']);
  var s='<section class="sum" aria-label="Resumen de la semana"><div><p class="eyebrow">Semana</p><h2>'+weekLabel()+'</h2><p class="kpis"><span><b>'+hs(tot)+' h</b> programadas</span><span><b>'+turnos+'</b> turnos</span><span><b>'+S.empleados.length+'</b> personas</span>'+
    (fests.length?'<span>Festivo: <b>'+fests.map(function(f){return dayName(f).toLowerCase()+' '+parse(f).getDate()+', '+esc(S.festivos[f])}).join('; ')+'</b></span>':'')+'</p></div>';
  s+='<ul class="alerts">'+al.map(function(a){return '<li class="al '+a[0]+'"><span>'+a[1]+'</span></li>'}).join('')+'</ul></section>';
  return s;
}

    });
  }else{
    try{localStorage.setItem(KEY,JSON.stringify(S));saved=snap();toast('Guardado en este navegador')}catch(e){S.guardado=prev;toast('Este navegador no permite guardar. Usa Herramientas, Copiar respaldo.')}
    render();
  }
}
function loadLocal(){try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.empleados&&o.dias&&(!EMB.guardado||(o.guardado&&o.guardado>EMB.guardado))){S=o;week=mondayOf(o.semanaInicial||week);saved=snap();render()}}catch(e){}}
function setTab(v){tab=v;try{history.replaceState(null,'','#'+v)}catch(e){try{location.hash=v}catch(e2){}}render();window.scrollTo(0,0)}

/* eventos */
root.addEventListener('input',function(ev){var t=ev.target;if(t.id&&/^(mk-nota|sol-|nota-txt|rp-)/.test(t.id))draft[t.id]=t.value});
root.addEventListener('click',function(ev){
  var c=ev.target.closest('.card');
  if(c){if(Date.now()<suppressUntil)return;if(!canCal()){toast('Para pedir un cambio usa Mi turno, Solicitar cambio de turno.');return}editor(c.dataset.f,c.dataset.emp,c.dataset.id);return}
  var b=ev.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  var menu=document.getElementById('menu');if(a!=='menu'&&menu)menu.hidden=true;
  var ed=canCal();
  if(a==='tab')setTab(b.dataset.v);
  else if(a==='hoy'){week=mondayOf(iso(new Date()));render()}
  else if(a==='prev'){week=add(week,-7);render()}
  else if(a==='next'){week=add(week,7);render()}
  else if(a==='mode'){mode=b.dataset.v;render()}
  else if(a==='menu'){menu.hidden=!menu.hidden;b.setAttribute('aria-expanded',String(!menu.hidden));if(!menu.hidden)menu.querySelector('button').focus()}
  else if(a==='whatsapp')textBox('Turnos para WhatsApp','Revisa el texto y cópialo para enviarlo al grupo del equipo.',whatsappText())
  else if(a==='soy'){YO=b.dataset.emp;try{localStorage.setItem(KEY_YO,YO)}catch(e){}render()}
  else if(a==='cambiaryo'){YO=null;try{localStorage.removeItem(KEY_YO)}catch(e){}render()}
  else if(a==='marcar')marcar()
  else if(a==='borrarmarca'){if(DB&&!busy){busy=true;DB.doc('marcas/'+b.dataset.id).delete().then(function(){busy=false;toast('Marca borrada');scheduleRender()},dbErr)}}
  else if(a==='enviarnota'){var tx=(dv('nota-txt','')||'').trim();if(!tx){toast('Escribe la nota antes de enviarla.');return}var now=new Date();dbAdd('notas',{emp:YO,texto:tx,fecha:iso(now),hora:hhmm(now),ts:now.toISOString(),uid:UID||null},'Nota enviada al administrador',['nota-txt'])}
  else if(a==='enviarsol'){
    var f=dv('sol-f',add(iso(new Date()),1)),tp=dv('sol-tipo','horario'),mo=(dv('sol-motivo','')||'').trim(),now2=new Date();
    if(!f){toast('Elige el día del turno.');return}
    var data={emp:YO,fecha:f,tipo:tp,motivo:mo,ts:now2.toISOString(),uid:UID||null};
    if(tp==='horario'){data.ini=dv('sol-ini','14:30');data.fin=dv('sol-fin','21:30');if(!data.ini||!data.fin||data.ini===data.fin){toast('Revisa la hora de entrada y de salida.');return}}
    if(tp==='cambio'){var otros=S.empleados.filter(function(x){return x.id!==YO});data.con=dv('sol-con',otros[0]?otros[0].id:'')}
    if(tp==='otro'&&!mo){toast('Cuenta en el motivo qué cambio necesitas.');return}
    dbAdd('solicitudes',data,'Solicitud enviada. Te avisamos aquí cuando la respondan.',['sol-motivo']);
  }
  else if(a==='cancelarsol'){if(DB&&!busy){busy=true;DB.doc('solicitudes/'+b.dataset.id).delete().then(function(){busy=false;toast('Solicitud cancelada');scheduleRender()},dbErr)}}
  else if(a==='aprobar'||a==='rechazar'){
    if(!OWNER||!DB||busy)return;var s=R.solicitudes.filter(function(x){return x.id===b.dataset.id})[0];if(!s)return;
    var aprob=a==='aprobar',aplica=aprob&&(s.tipo==='horario'||s.tipo==='descanso'||(s.tipo==='cambio'&&emp(s.con)))&&emp(s.emp);
    busy=true;DB.doc('respuestas/'+s.id).set({estado:aprob?'aprobada':'rechazada',respuesta:(dv('rp-'+s.id,'')||'').trim(),ts:new Date().toISOString(),aplicada:!!aplica}).then(function(){
      busy=false;delete draft['rp-'+s.id];if(aplica)aplicarSolicitud(s);else{toast(aprob?'Solicitud aprobada':'Solicitud rechazada');scheduleRender()}
    },dbErr);
  }
  else if(a==='copiarreg')textBox('Registro de horas','Cópialo y pégalo en Excel o Google Sheets.',registroTSV())
  else if(!ed)return;
  else if(a==='add')editor(b.dataset.f,b.dataset.emp,null)
  else if(a==='persona')personEditor(b.dataset.emp)
  else if(a==='guardar')guardar()
  else if(a==='undo')undo()
  else if(a==='nuevapersona')personEditor(null)
  else if(a==='exportar')textBox('Respaldo del calendario','Guarda este texto en un lugar seguro. Con Cargar respaldo vuelves a este punto.',JSON.stringify(S))
  else if(a==='importar')importBox()
  else if(a==='copiarprev')confirmBox('Repetir la semana anterior','Los turnos del '+weekLabel()+' se reemplazan con los de la semana anterior. Puedes deshacerlo después.','Repetir semana',function(){commit(function(){S.empleados.forEach(function(e){for(var i=0;i<7;i++){var f=add(week,i);setItems(f,e.id,items(add(f,-7),e.id).map(function(x){var y=clone(x);y.id=newId();return y}))}})},'Semana copiada de la anterior')})
  else if(a==='vaciar')confirmBox('Vaciar esta semana','Se quitan todos los turnos y descansos del '+weekLabel()+'. Puedes deshacerlo después.','Vaciar semana',function(){commit(function(){S.empleados.forEach(function(e){weekDays().forEach(function(f){setItems(f,e.id,[])})})},'Semana vaciada')});
});
root.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='fecha'&&t.value){week=mondayOf(t.value);render()}
  if(t.id==='orden'){sortBy=t.value;render()}
  if(t.id==='sol-f'||t.id==='sol-tipo'||t.id==='sol-con'){draft[t.id]=t.value;render()}
});
window.addEventListener('hashchange',function(){var v=(location.hash||'').slice(1);if(TABS.some(function(t){return t[0]===v})&&v!==tab){tab=v;render()}});
document.addEventListener('click',function(ev){var m=document.getElementById('menu');if(m&&!m.hidden&&!ev.target.closest('.menuwrap'))m.hidden=true});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){if(!ov.hidden)closeOv();var m=document.getElementById('menu');if(m)m.hidden=true;if(drag)endDrag(null)}
  if(!canCal()||tab!=='calendario')return;
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&ov.hidden){ev.preventDefault();undo()}
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='s'){ev.preventDefault();guardar()}
});

/* arrastrar y soltar (mouse y táctil), solo quien administra */
root.addEventListener('pointerdown',function(ev){
  var c=ev.target.closest('.card');if(!c||ev.button>0||!canCal())return;
  var r=c.getBoundingClientRect();
  drag={el:c,id:c.dataset.id,f:c.dataset.f,emp:c.dataset.emp,x:ev.clientX,y:ev.clientY,ox:ev.clientX-r.left,oy:ev.clientY-r.top,w:r.width,on:false,pid:ev.pointerId,target:null,ghost:null};
  try{c.setPointerCapture(ev.pointerId)}catch(e){}
});
document.addEventListener('pointermove',function(ev){
  if(!drag||ev.pointerId!==drag.pid)return;
  if(!drag.on){if(Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)<6)return;drag.on=true;var g=drag.el.cloneNode(true);g.classList.add('ghost');g.style.width=drag.w+'px';g.removeAttribute('data-id');document.body.appendChild(g);drag.ghost=g;drag.el.classList.add('lifted')}
  ev.preventDefault();
  var copy=mode==='copiar'||ev.ctrlKey||ev.altKey||ev.metaKey;
  drag.ghost.style.left=(ev.clientX-drag.ox)+'px';drag.ghost.style.top=(ev.clientY-drag.oy)+'px';
  var tag=drag.ghost.querySelector('.copytag');if(copy&&!tag){tag=document.createElement('span');tag.className='copytag';tag.textContent='+';drag.ghost.appendChild(tag)}else if(!copy&&tag)tag.remove();
  var under=document.elementFromPoint(ev.clientX,ev.clientY),cell=under&&under.closest('.cell');
  if(drag.target&&drag.target!==cell)drag.target.classList.remove('over');
  if(cell)cell.classList.add('over');drag.target=cell;
  var w=document.getElementById('wrap');if(w){var r=w.getBoundingClientRect();if(ev.clientX<r.left+48)w.scrollLeft-=14;else if(ev.clientX>r.right-48)w.scrollLeft+=14}
  if(ev.clientY<56)window.scrollBy(0,-14);else if(ev.clientY>window.innerHeight-56)window.scrollBy(0,14);
},{passive:false});
function endDrag(ev){
  if(!drag)return;var d=drag;drag=null;
  if(d.ghost)d.ghost.remove();d.el.classList.remove('lifted');if(d.target)d.target.classList.remove('over');
  var flush=function(){if(pendingRender){pendingRender=false;render()}};
  if(!d.on||!ev){flush();return}
  suppressUntil=Date.now()+350;
  var cell=d.target;if(!cell){flush();return}
  var nf=cell.dataset.f,ne=cell.dataset.emp,copy=mode==='copiar'||ev.ctrlKey||ev.altKey||ev.metaKey;
  if(nf===d.f&&ne===d.emp&&!copy){flush();return}
  var it=findItem(d.f,d.emp,d.id);if(!it){flush();return}
  pendingRender=false;
  var e2=emp(ne),who=e2?corto(e2):'';
  var replaces=it.tipo==='descanso'&&items(nf,ne).some(function(x){return x.tipo==='turno'});
  commit(function(){var n=clone(it);if(copy)n.id=newId();else removeItem(d.f,d.emp,d.id);place(nf,ne,n)},(copy?'Copiado':'Movido')+' a '+who+', '+dayName(nf).toLowerCase()+' '+parse(nf).getDate()+(replaces?'. El descanso reemplazó sus turnos':''));
}
document.addEventListener('pointerup',function(ev){if(drag&&ev.pointerId===drag.pid)endDrag(ev)});
document.addEventListener('pointercancel',function(ev){if(drag&&ev.pointerId===drag.pid)endDrag(null)});
window.addEventListener('beforeunload',function(ev){if(OWNER&&isDirty()&&!readOnly){ev.preventDefault();ev.returnValue=''}});

/* arranque */
function suscribir(){
  dbTimer=setTimeout(function(){if(dbState==='loading'){dbState='slow';scheduleRender()}},10000);
  function ok(){if(dbState!=='ok'){dbState='ok';clearTimeout(dbTimer)}scheduleRender()}
  function fail(e){clearTimeout(dbTimer);if(e&&e.code==='revoked'){DB=null;dbState='error'}else dbState='error';scheduleRender()}
  function rows(s){return s.docs.map(function(d){var o=Object.assign({},d.data()||{});o.id=d.id;return o})}
  DB.doc('calendario/actual').onSnapshot(function(d){
    if(d.exists&&!d.metadata.hasPendingWrites&&!isDirty()){var o=d.data()||{};if(o.empleados&&o.dias)aplicarRemoto(clone(o))}
    else if(!d.exists&&OWNER)saved=''; // calendario recién instalado: el dueño lo guarda una vez en la base
    ok();
  },fail);
  DB.collection('marcas').onSnapshot(function(s){R.marcas=rows(s);ok()},fail);
  DB.collection('notas').onSnapshot(function(s){R.notas=rows(s);ok()},fail);
  DB.collection('solicitudes').onSnapshot(function(s){R.solicitudes=rows(s);ok()},fail);
  DB.collection('respuestas').onSnapshot(function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data()});R.respuestas=m;ok()},fail);
}
render();
if(HAS_CLAUDE){
  var use=function(n){return Promise.resolve(window.claude.use(n)).catch(function(){return null})};
  Promise.all([use('db'),use('user')]).then(function(r){
    DB=r[0]||null;var U=r[1]||null;
    var p=U?Promise.all([U.isOwner(),U.id()]):Promise.resolve([false,null]);
    return p.then(function(v){OWNER=!!v[0];UID=v[1]||null;if(window.TDE_EQUIPO&&window.TDE_EQUIPO.emp)YO=window.TDE_EQUIPO.emp;
      if(!DB)dbState='off';else suscribir();
      if(!DB&&OWNER)loadLocal();
      if(!(location.hash||'').slice(1))tab='';
      render();
    });
  });
}else loadLocal();
})();
</script>
